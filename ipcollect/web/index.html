<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 客户端路由(/4842、/1.1.1.0/24 等深层路径)下, 让相对资源与 document.baseURI 锚定站点根 -->
  <base href="/" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- PWA: 可安装为桌面/主屏应用(独立窗口)。SW 已在 main.js 注册, 数据缓存维持现状(HTTP 缓存 + ?v=) -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PEER.AS" />
  <title>PEER.AS — BGP, IP & ASN Insights</title>
  <meta name="description" content="PEER.AS — explore global BGP routing, IP prefixes, ASNs, AS_PATH, origins and peering. An open-source, modern and powerful online BGP Looking Glass and IP/ASN analysis tool." />
  <meta name="keywords" content="peer.as,BGP,ASN,IP,prefix,AS_PATH,looking glass,peering,routing,whois,IP lookup,ASN lookup,BGP tools,IP info" />
  <link rel="canonical" href="https://peer.as/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PEER.AS" />
  <meta property="og:title" content="PEER.AS — BGP, IP & ASN Insights" />
  <meta property="og:description" content="Explore global BGP routing, IP prefixes, ASNs and AS_PATH. An open-source, modern and powerful online BGP Looking Glass & IP/ASN analysis tool." />
  <meta property="og:url" content="https://peer.as/" />
  <meta name="twitter:card" content="summary" />
  <link rel="alternate" hreflang="zh" href="https://peer.as/?lang=zh" />
  <link rel="alternate" hreflang="en" href="https://peer.as/?lang=en" />
  <script>
    // 首屏前定主题, 避免闪白
    (function () { var t = localStorage.getItem('ipc-theme');
      if (t === 'light' || t === 'dark' || t === 'ba') document.documentElement.setAttribute('data-theme', t); })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
